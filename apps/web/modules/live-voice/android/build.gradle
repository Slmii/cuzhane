plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.cuzhaneapp.livevoice'
version = '1.0.0'

android {
  namespace "expo.modules.livevoice"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // The audio device module `react-native-webrtc` plays through (`LiveVoicePackage`).
  implementation project(':react-native-webrtc')
}
