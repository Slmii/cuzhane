name: Deploy server

# Only the API. The Expo app ships through EAS and has nothing to do with this.
on:
    push:
        branches: [main, development]
        paths:
            - 'apps/server/**'
            - 'deploy/**'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - 'pnpm-workspace.yaml'
            - '.npmrc'
            - '.github/workflows/deploy-server.yml'
    workflow_dispatch:

# Two pushes in quick succession must not race for the droplet: the second `up -d` could
# otherwise start while the first is still swapping containers, and the image that ends up
# running would be whichever finished last rather than whichever was newer.
# **One group for both branches, not one per branch.** They deploy into the same directory on
# the same box: a per-branch group let a production and a preview job overwrite each other's
# `compose.yml` between validation and `up`, and race each other's `sed -i` on `.env`. Separate
# tag *names* are no protection when the file holding them is shared.
concurrency:
    group: deploy-server
    cancel-in-progress: false

# The image name is lowercase on purpose: GHCR rejects a path with a capital in it, and the
# owner here is `Slmii`.
env:
    IMAGE: ghcr.io/slmii/cuzhane-api

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            # **Every action is pinned to a commit, not a tag.** A tag is mutable and points at
            # code its author can replace; the deploy job below hands a key to whatever it
            # resolves to. Renovate/Dependabot can bump these with a review.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

            - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
              with:
                  # The repo root, because the Dockerfile installs a workspace.
                  context: .
                  file: apps/server/Dockerfile
                  push: true
                  # **`latest` follows `main` and nothing else.** It was tagged on every
                  # branch, so a push to `development` moved it — and because production's
                  # `IMAGE_TAG` fell back to `latest` when unset, the next `up -d` put the
                  # development build into production. Caught because both containers restarted
                  # together and `cuzhane-api-1` was running `:latest`. The commit tag is pushed
                  # from every branch; only this pointer is branch-specific.
                  tags: |
                      ${{ env.IMAGE }}:${{ github.sha }}
                      ${{ github.ref == 'refs/heads/main' && format('{0}:latest', env.IMAGE) || '' }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    deploy:
        needs: build
        runs-on: ubuntu-latest
        # `workflow_dispatch` can be aimed at any branch, and this job deploys to a live box.
        # Only these two have a target; anything else is a feature branch and must not deploy.
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development'
        permissions:
            contents: read
        steps:
            # **The deployment files always come from `main`, whichever branch is deploying.**
            # `compose.yml`, `Caddyfile` and `backup.sh` describe the *whole box* — both APIs,
            # the shared Postgres and the edge in front of them — and this job scp's them over
            # the running copies. Taken from the triggering branch, a merge to `development`
            # could repoint `{$DOMAIN}` at the preview container, change production's image, or
            # rewrite the `backup.sh` that root's nightly cron runs with the object-store key.
            # That would make `development` a path to production with only `main` protected, and
            # README's claim that protecting `main` is the control that matters would be false.
            #
            # The consequence to know: **infrastructure changes reach the box only through
            # `main`.** A preview deploy cannot test a compose change before it is merged —
            # which is the correct trade for a file that owns production, and why this very
            # change has to land on `main` before `development` can deploy against it.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: main

            # **The branch picks the target, and nothing else does.** `main` swaps the
            # production API, `development` swaps the preview one beside it. They share the
            # droplet, the Caddy in front and the Postgres behind — but a different container,
            # a different database and a *different tag variable*, so deploying one never moves
            # the other's image.
            - name: Choose the target
              id: target
              run: |
                  if [ "${{ github.ref }}" = "refs/heads/main" ]; then
                    echo "service=api"                       >> "$GITHUB_OUTPUT"
                    echo "container=cuzhane-api-1"           >> "$GITHUB_OUTPUT"
                    echo "tag_var=IMAGE_TAG"                 >> "$GITHUB_OUTPUT"
                  else
                    echo "service=api-preview"               >> "$GITHUB_OUTPUT"
                    echo "container=cuzhane-api-preview-1"   >> "$GITHUB_OUTPUT"
                    echo "tag_var=PREVIEW_IMAGE_TAG"         >> "$GITHUB_OUTPUT"
                  fi

            # **No third-party action holds the droplet's key.** A marketplace action given an
            # SSH secret is a supply-chain foothold with root on the box (the tj-actions
            # pattern); the runner's own `ssh` is a few more lines and nobody else's code.
            # `DROPLET_HOST_KEY` is the droplet's public host key — without it this would
            # trust-on-first-use every run, which is no check at all. Produce it once with
            # `ssh-keyscan -t ed25519 <host>`.
            - name: Open an SSH session to the droplet
              env:
                  KEY: ${{ secrets.DROPLET_SSH_KEY }}
                  HOST_KEY: ${{ secrets.DROPLET_HOST_KEY }}
              run: |
                  mkdir -p ~/.ssh
                  printf '%s\n' "$KEY" > ~/.ssh/id_deploy
                  chmod 600 ~/.ssh/id_deploy
                  printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts

            # Compose, Caddy and the backup script are part of the release. Without this the
            # workflow triggers on `deploy/**` and then deploys a new image against whatever
            # configuration the box happened to have — a release that adds an environment
            # variable or a healthcheck would silently run without it.
            - name: Ship the deployment files
              env:
                  HOST: ${{ secrets.DROPLET_HOST }}
                  USER_NAME: ${{ secrets.DROPLET_USER }}
              run: |
                  scp -i ~/.ssh/id_deploy deploy/compose.yml deploy/Caddyfile deploy/backup.sh \
                    "$USER_NAME@$HOST:/opt/cuzhane/"
                  ssh -i ~/.ssh/id_deploy "$USER_NAME@$HOST" 'chmod +x /opt/cuzhane/backup.sh'

            - name: Deploy
              env:
                  HOST: ${{ secrets.DROPLET_HOST }}
                  USER_NAME: ${{ secrets.DROPLET_USER }}
              run: |
                  ssh -i ~/.ssh/id_deploy "$USER_NAME@$HOST" \
                    "TAG_VAR='${{ steps.target.outputs.tag_var }}' \
                     SERVICE='${{ steps.target.outputs.service }}' \
                     CONTAINER='${{ steps.target.outputs.container }}' \
                     IS_PRODUCTION='${{ github.ref == 'refs/heads/main' }}' \
                     SHA='${{ github.sha }}' bash -s" <<'REMOTE'
                  set -euo pipefail
                  cd /opt/cuzhane

                  # **Before any compose command at all.** Every one of them interpolates the
                  # file, and the tags carry `:?` — so an unset tag makes even `compose ps`
                  # fail. That mattered most in the backup guard below, where the failure read
                  # as "postgres is not running" and skipped the pre-migration dump in silence.
                  touch .env

                  # **A file with no trailing newline would take the append onto its last
                  # line.** `printf >>` does not start one, so `POSTGRES_PASSWORD=secret`
                  # becomes `POSTGRES_PASSWORD=secretIMAGE_TAG=abc` — the password corrupted and
                  # the tag never defined. `.env` is hand-edited on the box, so this is a real
                  # shape for it to be in.
                  if [ -s .env ] && [ -n "$(tail -c1 .env)" ]; then
                    printf '\n' >> .env
                  fi

                  if grep -q "^${TAG_VAR}=" .env; then
                    sed -i "s|^${TAG_VAR}=.*|${TAG_VAR}=${SHA}|" .env
                  else
                    printf '%s=%s\n' "$TAG_VAR" "$SHA" >> .env
                  fi

                  # The only copy of the data from before this release's migrations. A
                  # destructive migration is not recoverable without it.
                  #
                  # Guarded on Postgres actually running, because on the very first deploy it
                  # is not: `backup.sh` calls `docker compose exec postgres`, which fails with
                  # "service postgres is not running", and `set -e` then aborts a deploy that
                  # had nothing to lose in the first place. The guard is here rather than in
                  # the script so that the nightly cron still fails loudly when the database
                  # it is meant to be dumping is down.
                  # **Production only.** The dump is of `cuzhane`, and a preview deploy cannot
                  # reach it — taking one anyway would add a copy of the production database to
                  # the disk every time somebody merges to `development`.
                  if [ "$IS_PRODUCTION" = "true" ] && [ -x ./backup.sh ] \
                     && docker compose ps --services --filter status=running | grep -qx postgres; then
                    ./backup.sh
                  else
                    echo "not a production deploy, or postgres is down — skipping the dump"
                  fi

                  # Validate before anything is torn down: a compose file that does not parse
                  # should fail the job, not leave the stack half-swapped.
                  docker compose config --quiet

                  # The exact commit, not `latest`. Two deploys in flight cannot then disagree
                  # about which image `latest` means, and a rollback is this same line with an
                  # older sha.
                  docker compose pull "$SERVICE"

                  # **Caddy alone, with `--no-deps`.** The Caddyfile ships with every release so
                  # caddy has to be reconciled — but it `depends_on` both APIs, and naming it
                  # here without this dragged production's container into a preview deploy and
                  # recreated it. `--no-deps` updates the edge and touches nothing behind it.
                  # **Validate in a throwaway container, before the running edge is touched.**
                  # Caddy refuses a file *whole*: one bad site block and production's stops
                  # loading too. Checking with `exec` after `up` is too late — the container is
                  # already crash-looping by then, and the `exec` fails for that reason rather
                  # than telling you why. `run --rm` gets the same bind mount and the same
                  # environment, so it sees exactly what the real one would.
                  # **`-T`, and the whole deploy depends on it.** This script is fed to
                  # `bash -s` from a heredoc, so **stdin is the script**. `compose run` without
                  # `-T` allocates a TTY and consumes stdin — swallowing every remaining line.
                  # It happened: a run validated the Caddyfile, ate the rest, and reported
                  # success having swapped nothing. That is the failure the "prove the deploy
                  # actually happened" check below exists for, and it caught it.
                  docker compose run --rm -T --no-deps --entrypoint caddy caddy \
                    validate --config /etc/caddy/Caddyfile

                  docker compose up -d --no-deps caddy

                  # **And reload.** The Caddyfile is a bind mount, so replacing it does not change
                  # caddy's *service definition* — compose reports it up to date and keeps the old
                  # configuration loaded, leaving a routing change dormant until something else
                  # restarts the container.
                  docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile

                  # **`--no-deps` here too.** With dependencies, a compose file shipped from
                  # `development` would recreate the *shared* Postgres — production's database —
                  # during a preview deploy. That is the same class of accident as the `caddy`
                  # one above, and worse. The cost is losing `depends_on`'s "wait for a healthy
                  # Postgres" gate, which only ever mattered on a cold boot; `--wait` below still
                  # fails the job if the API cannot come up against whatever it finds.
                  docker compose up -d --wait --wait-timeout 180 --no-deps "$SERVICE"

                  docker image prune -f
                  REMOTE

            # **The proof is its own SSH command, outside the script it is checking.**
            #
            # It used to be the last lines of the heredoc above, and that is precisely where it
            # could not do its job: the script is piped to `bash -s`, so any command inside that
            # reads stdin swallows the rest of it — the script ends early, `bash` exits 0, and
            # the job goes green having swapped nothing. That happened twice: once when a
            # command ate the script (the reason this check was written), and again when a
            # `compose run` without `-T` did the same and took this very check down with it.
            #
            # A verification that a failing deploy can skip is not a verification. Run over its
            # own connection it executes whatever the script did or did not do, and compares the
            # container that is actually running against the commit this job set out to deploy.
            - name: Prove the deploy actually took
              env:
                  HOST: ${{ secrets.DROPLET_HOST }}
                  USER_NAME: ${{ secrets.DROPLET_USER }}
                  CONTAINER: ${{ steps.target.outputs.container }}
                  SHA: ${{ github.sha }}
              run: |
                  RUNNING=$(ssh -i ~/.ssh/id_deploy "$USER_NAME@$HOST" \
                    "docker inspect --format '{{.Config.Image}}' '$CONTAINER'" < /dev/null)
                  echo "running image: $RUNNING"
                  case "$RUNNING" in
                    *"$SHA") echo "image matches the commit" ;;
                    *) echo "DEPLOY DID NOT TAKE: expected $SHA, found $RUNNING"; exit 1 ;;
                  esac

            # Both secrets come in and the shell picks, rather than indexing `secrets` with an
            # expression — that form is not reliably supported and fails as an empty string,
            # which would curl `https:///health` and pass by accident.
            - name: Smoke test over HTTPS
              env:
                  PROD_DOMAIN: ${{ secrets.DROPLET_DOMAIN }}
                  PREVIEW_DOMAIN: ${{ secrets.DROPLET_PREVIEW_DOMAIN }}
                  IS_PRODUCTION: ${{ github.ref == 'refs/heads/main' }}
              # The healthcheck runs inside the container; this is the same question asked from
              # outside, so a broken certificate or proxy also fails the deploy.
              run: |
                  if [ "$IS_PRODUCTION" = "true" ]; then DOMAIN="$PROD_DOMAIN"; else DOMAIN="$PREVIEW_DOMAIN"; fi
                  test -n "$DOMAIN" || { echo "no domain secret for this branch"; exit 1; }
                  curl -fsS --max-time 15 "https://$DOMAIN/health"

            - name: Remove the key
              if: always()
              run: rm -f ~/.ssh/id_deploy
