name: Claude Code Review

on:
    pull_request:
        types: [opened, synchronize, ready_for_review, reopened]
        # `branches` filters on the PR's BASE (target) branch, so this runs only for
        # PRs merging into development. A PR targeting main — the release promotion —
        # is deliberately not reviewed here.
        branches: [development]
        # Optional: Only run on specific file changes
        # paths:
        #   - "src/**/*.ts"
        #   - "src/**/*.tsx"
        #   - "src/**/*.js"
        #   - "src/**/*.jsx"

jobs:
    claude-review:
        # Optional: Filter by PR author
        # if: |
        #   github.event.pull_request.user.login == 'external-contributor' ||
        #   github.event.pull_request.user.login == 'new-developer' ||
        #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

        runs-on: ubuntu-latest
        permissions:
            contents: read
            # Write, or the buffered inline comments have no permission to be posted.
            pull-requests: write
            issues: read
            id-token: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - name: Run Claude Code Review
              id: claude-review
              uses: anthropics/claude-code-action@v1
              with:
                  claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
                  plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
                  plugins: 'code-review@claude-code-plugins'
                  prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
                  # The review has to read the PR before it can comment on it: with only the
                  # comment tool allowed, every `gh pr diff` / `gh pr view` was denied (21 denials
                  # on one run, 1 on the next) and the job "passed" with nothing to say.
                  # Opus 5.5 — left unset the action ran the review on its default, Sonnet 5.
                  #
                  # **The run ends when Claude's turn does.** On PR #11 it started its four review
                  # agents in the background, said it would wait, and ended — the agents died with
                  # the job and nothing was posted. Hence the appended instruction.
                  #
                  # `grep`, `head` and `wc` because it pipes `gh pr diff` through them to skip the
                  # binary assets (5 denials on that run). Read-only; `awk` is left out on purpose —
                  # it can run commands, and a PR on this public repo can steer the prompt.
                  #
                  # **Silent when clean.** Findings go inline; a clean review posts nothing. So
                  # `gh pr comment` is not allowed at all — the plugin's "No issues found" summary
                  # is the only thing it would post. The flip side: the plugin skips a PR it has
                  # already commented on, and with no summary every push is reviewed again.
                  claude_args: '--model claude-opus-5-5 --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(grep:*),Bash(head:*),Bash(wc:*),Read,Glob,Grep" --append-system-prompt "This runs in CI and the job ends when your turn ends. Run every subagent in the foreground and wait for its result; never start one in the background. Do not end your turn until every validated issue is posted with the inline comment tool. If no issues are found, post nothing at all: no summary comment, no gh pr comment."'
                  # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
                  # or https://code.claude.com/docs/en/cli-reference for available options
