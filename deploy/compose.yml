# The droplet's whole stack. Lives at /opt/cuzhane on the server, beside a `.env` built from
# `.env.example` in this folder. CI copies this file up on every deploy, so it is the source of
# truth — never edit the copy on the box.
#
#   docker compose pull api && docker compose up -d --wait
#
# Postgres publishes **no port**. It is reachable only from the `back` network, which is what
# keeps the database off the public internet without a firewall rule having to be right —
# Docker's own iptables rules bypass ufw for any published port, so "don't publish it" is the
# only guarantee here. Never add a `ports:` entry to postgres, not even for a moment.

name: cuzhane

services:
    caddy:
        # Pinned to the minor. A major bump should be somebody's decision.
        image: caddy:2.11-alpine
        restart: unless-stopped
        ports:
            - '80:80'
            - '443:443'
        environment:
            DOMAIN: ${DOMAIN}
            PREVIEW_DOMAIN: ${PREVIEW_DOMAIN}
            SITE_DOMAIN: ${SITE_DOMAIN}
            ACME_EMAIL: ${ACME_EMAIL}
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile:ro
            # The built marketing site. CI rsyncs into this directory; Caddy only reads it.
            - ./www:/srv/www:ro
            # The certificates live here. Losing this volume means re-issuing them, and Let's
            # Encrypt rate-limits that — five per week for the same domain.
            - caddy_data:/data
            - caddy_config:/config
        networks:
            # The edge never touches the database.
            - front
        security_opt:
            - no-new-privileges:true
        logging: &logging
            driver: json-file
            options:
                # Unrotated json-file logs fill a 48 GB disk given a few months and a stack
                # trace per error — and a full disk stops Postgres accepting writes.
                max-size: '10m'
                max-file: '3'
        depends_on:
            - api
            - api-preview

    api:
        image: ghcr.io/slmii/cuzhane-api:${IMAGE_TAG:-latest}
        restart: unless-stopped
        environment:
            NODE_ENV: production
            PORT: 3001
            # The phone sends no Origin header, so this only matters if a browser ever calls
            # the API. Left open rather than pretending otherwise: auth is bearer-only and no
            # credentials ride on a cookie, so a hostile page cannot use a victim's session.
            CORS_ORIGIN: ${CORS_ORIGIN:-*}
            # `POSTGRES_PASSWORD` is spliced into a URI here — see `.env.example` for why it
            # must not contain `/`, `@`, `:`, `#` or `?`.
            DATABASE_URL: postgresql://cuzhane:${POSTGRES_PASSWORD}@postgres:5432/cuzhane
            CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
            CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
            APP_STORE_URL: ${APP_STORE_URL:-}
        networks:
            - front
            - back
        # **This is what makes a deploy able to fail.** Without it `docker compose up -d`
        # returns the moment the container is *created*, so a crash-looping API — a failed
        # migration, a bad build — reported a green deploy while every request 502'd. With it,
        # `up -d --wait` blocks until the API answers its own health route.
        healthcheck:
            test:
                [
                    'CMD',
                    'node',
                    '-e',
                    "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
                ]
            interval: 10s
            timeout: 5s
            retries: 6
            # Migrations run before the server listens, and they run inside this window.
            start_period: 60s
        # The image runs as `node` and writes nothing: no uploads, no cache, no logs to disk.
        read_only: true
        tmpfs:
            - /tmp
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        # On a 2 GB box the OOM killer's usual choice is Postgres, because it is the largest
        # process. A ceiling on Node means a runaway request kills the API instead, and the API
        # comes back on its own.
        mem_limit: 768m
        pids_limit: 256
        logging: *logging
        depends_on:
            postgres:
                condition: service_healthy

    # **Preview: the same image, a second database, a quarter of the memory.**
    #
    # It exists so the `development` branch — and the Expo `preview` channel that points at it —
    # can be exercised against something that is not production. Before this, `preview` builds
    # resolved `EXPO_PUBLIC_API_URL` to the production host and read and wrote live rows.
    #
    # **One Postgres, two databases, not two Postgres.** This is a 2 GB droplet and the
    # production pair already caps at 768m + 640m; a second instance would not fit beside them.
    # A second *database* costs almost nothing and still isolates what matters — a preview
    # migration cannot touch a production row. What it does not isolate is the process: a
    # preview query storm or a Postgres crash takes production down with it. That is the trade,
    # and it holds only while preview traffic is a couple of developers. The answer when it
    # stops holding is a second droplet, not a second container here.
    #
    # `cuzhane_preview` is created by hand once (see deploy/README.md) rather than by an init
    # script: `POSTGRES_DB` only runs on an empty data directory, and this volume is long past
    # that.
    #
    # **Clerk is production's, deliberately.** Preview is for developers, so sharing the user
    # directory means signing in with your own account — and because identity is Clerk's, the
    # preview database keys its own rows off the same user ids. No preview-only secret exists.
    api-preview:
        image: ghcr.io/slmii/cuzhane-api:${PREVIEW_IMAGE_TAG:-latest}
        restart: unless-stopped
        environment:
            NODE_ENV: production
            PORT: 3001
            CORS_ORIGIN: ${CORS_ORIGIN:-*}
            DATABASE_URL: postgresql://cuzhane:${POSTGRES_PASSWORD}@postgres:5432/cuzhane_preview
            CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
            CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
            APP_STORE_URL: ${APP_STORE_URL:-}
        networks:
            - front
            - back
        healthcheck:
            test:
                [
                    'CMD',
                    'node',
                    '-e',
                    "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
                ]
            interval: 10s
            timeout: 5s
            retries: 6
            start_period: 60s
        read_only: true
        tmpfs:
            - /tmp
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        # Half of production's, and the reason the pair fits on this box at all. Preview serves
        # two people; production must never lose memory to it.
        mem_limit: 384m
        pids_limit: 256
        logging: *logging
        depends_on:
            postgres:
                condition: service_healthy

    postgres:
        image: postgres:17.11-alpine
        restart: unless-stopped
        # **Loopback only, and the address is the whole point.** `127.0.0.1:5432:5432` is
        # reachable from the droplet itself and from nothing else, which is what lets a laptop
        # connect through an SSH tunnel. A bare `5432:5432` would bind 0.0.0.0 — and *that* is
        # the case where Docker writes its own iptables rules ahead of ufw and puts the database
        # on the public internet while `ufw status` still says the port is closed. Never drop
        # the address.
        ports:
            - '127.0.0.1:5432:5432'
        environment:
            POSTGRES_USER: cuzhane
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: cuzhane
        volumes:
            - pgdata:/var/lib/postgresql/data
        networks:
            - back
        healthcheck:
            # The API runs its migrations at boot, so it must not start against a database
            # that is still initialising.
            test: ['CMD-SHELL', 'pg_isready -U cuzhane -d cuzhane']
            interval: 5s
            timeout: 5s
            retries: 10
        security_opt:
            - no-new-privileges:true
        mem_limit: 640m
        logging: *logging

networks:
    # Two networks rather than one, so a compromised Caddy cannot open a socket to Postgres.
    front:
    back:

volumes:
    caddy_data:
    caddy_config:
    # `BabRead` is append-only and exists nowhere else. `docker compose down -v`, a volume
    # prune, or losing the droplet destroys it — see `deploy/README.md`.
    pgdata:
