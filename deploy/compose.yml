# The droplet's stack — everything but preview's API, which is `compose.preview.yml`. Lives at
# /opt/cuzhane on the server, beside a `.env` built from `.env.example` in this folder, whose
# `COMPOSE_FILE` merges the two for every compose command there. CI copies this file up **from
# `main`** on every deploy, so it is the source of truth — never edit the copy on the box.
#
#   docker compose pull api && docker compose up -d --wait
#
# Postgres publishes **no port**. It is reachable only from the `back` network, which is what
# keeps the database off the public internet without a firewall rule having to be right —
# Docker's own iptables rules bypass ufw for any published port, so "don't publish it" is the
# only guarantee here. Never add a `ports:` entry to postgres, not even for a moment.

name: cuzhane

services:
    caddy:
        # Pinned to the minor. A major bump should be somebody's decision.
        image: caddy:2.11-alpine
        restart: unless-stopped
        ports:
            - '80:80'
            - '443:443'
        environment:
            # **All three are `:?`, and the reason is that Caddy fails whole.** A blank here
            # passes `compose config` — it only warns — and then produces a site block with no
            # address, which Caddy rejects as "server block without any key", refusing the
            # *entire* file. One unset variable therefore takes production's edge down with it,
            # not just its own site. Verified against caddy:2.11-alpine.
            DOMAIN: ${DOMAIN:?required — Caddy refuses the whole file if any site address is blank}
            PREVIEW_DOMAIN: ${PREVIEW_DOMAIN:?required — see DOMAIN}
            SITE_DOMAIN: ${SITE_DOMAIN:?required — see DOMAIN}
            ACME_EMAIL: ${ACME_EMAIL}
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile:ro
            # The built marketing site. CI rsyncs into this directory; Caddy only reads it.
            - ./www:/srv/www:ro
            # The certificates live here. Losing this volume means re-issuing them, and Let's
            # Encrypt rate-limits that — five per week for the same domain.
            - caddy_data:/data
            - caddy_config:/config
        networks:
            # The edge never touches the database.
            - front
        security_opt:
            - no-new-privileges:true
        logging: &logging
            driver: json-file
            options:
                # Unrotated json-file logs fill a 48 GB disk given a few months and a stack
                # trace per error — and a full disk stops Postgres accepting writes.
                max-size: '10m'
                max-file: '3'
        # Only `api`: this file must stand alone (`backup.sh` runs it with `-f`), and preview's API
        # is in the other one. It is start-up order and nothing more — Caddy retries a backend
        # that is not up yet.
        depends_on:
            - api

    api:
        # **No `:-latest` fallback.** It used to have one, and that is how a development
        # build reached production: `latest` moved, `IMAGE_TAG` was never written to `.env`, and
        # the next `up -d` resolved the fallback. Compose now fails on an unset variable, which
        # is the correct outcome — a deploy that does not know its commit should not run.
        image: ghcr.io/slmii/cuzhane-api:${IMAGE_TAG:?set by CI, or pin it in .env}
        restart: unless-stopped
        environment:
            NODE_ENV: production
            PORT: 3001
            # The phone sends no Origin header, so this only matters if a browser ever calls
            # the API. Left open rather than pretending otherwise: auth is bearer-only and no
            # credentials ride on a cookie, so a hostile page cannot use a victim's session.
            CORS_ORIGIN: ${CORS_ORIGIN:-*}
            # `POSTGRES_PASSWORD` is spliced into a URI here — see `.env.example` for why it
            # must not contain `/`, `@`, `:`, `#` or `?`.
            DATABASE_URL: postgresql://cuzhane:${POSTGRES_PASSWORD}@postgres:5432/cuzhane
            CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
            CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
            APP_STORE_URL: ${APP_STORE_URL:-}
            # The verse meal, fetched live from the Quran Foundation. Unset, the API still boots
            # and only the meal answers 503 — see `quranTranslation.service.ts`.
            QURAN_CLIENT_ID: ${QURAN_CLIENT_ID:-}
            QURAN_CLIENT_SECRET: ${QURAN_CLIENT_SECRET:-}
        volumes:
            - ./mushaf:/app/apps/server/mushaf:ro
        networks:
            - front
            - back
        # **This is what makes a deploy able to fail.** Without it `docker compose up -d`
        # returns the moment the container is *created*, so a crash-looping API — a failed
        # migration, a bad build — reported a green deploy while every request 502'd. With it,
        # `up -d --wait` blocks until the API answers its own health route.
        healthcheck:
            test:
                [
                    'CMD',
                    'node',
                    '-e',
                    "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
                ]
            interval: 10s
            timeout: 5s
            retries: 6
            # Migrations run before the server listens, and they run inside this window.
            start_period: 60s
        # The image runs as `node` and writes nothing: no uploads, no cache, no logs to disk.
        read_only: true
        tmpfs:
            - /tmp
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        # On a 2 GB box the OOM killer's usual choice is Postgres, because it is the largest
        # process. A ceiling on Node means a runaway request kills the API instead, and the API
        # comes back on its own.
        mem_limit: 768m
        pids_limit: 256
        logging: *logging
        depends_on:
            postgres:
                condition: service_healthy

    # `api-preview` lives in `compose.preview.yml` — the one part of the stack a `development`
    # deploy ships. See that file.

    postgres:
        image: postgres:17.11-alpine
        restart: unless-stopped
        # **Loopback only, and the address is the whole point.** `127.0.0.1:5432:5432` is
        # reachable from the droplet itself and from nothing else, which is what lets a laptop
        # connect through an SSH tunnel. A bare `5432:5432` would bind 0.0.0.0 — and *that* is
        # the case where Docker writes its own iptables rules ahead of ufw and puts the database
        # on the public internet while `ufw status` still says the port is closed. Never drop
        # the address.
        ports:
            - '127.0.0.1:5432:5432'
        environment:
            POSTGRES_USER: cuzhane
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: cuzhane
        volumes:
            - pgdata:/var/lib/postgresql/data
        networks:
            - back
        healthcheck:
            # The API runs its migrations at boot, so it must not start against a database
            # that is still initialising.
            test: ['CMD-SHELL', 'pg_isready -U cuzhane -d cuzhane']
            interval: 5s
            timeout: 5s
            retries: 10
        security_opt:
            - no-new-privileges:true
        mem_limit: 640m
        logging: *logging

networks:
    # Two networks rather than one, so a compromised Caddy cannot open a socket to Postgres.
    front:
    back:

volumes:
    caddy_data:
    caddy_config:
    # `BabRead` is append-only and exists nowhere else. `docker compose down -v`, a volume
    # prune, or losing the droplet destroys it — see `deploy/README.md`.
    pgdata:
