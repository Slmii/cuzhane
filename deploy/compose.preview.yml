# Preview's API — **and only that.** Merged over `compose.yml` on the box
# (`COMPOSE_FILE=compose.yml:compose.preview.yml` in its `.env`), so every compose command there
# sees both.
#
# **This file comes from the branch that deploys; `compose.yml` always comes from `main`.**
# That is what lets `development` change preview's own settings — a new environment variable,
# a memory limit — without a detour through `main`, while the shared parts (Caddy, Postgres,
# backups) and production's `api` stay `main`'s alone. The deploy workflow refuses this file if
# it defines anything but `api-preview`: an override here could otherwise redefine production's
# services, since compose merges files by service name.
#
# It leans on `compose.yml` for the `front`/`back` networks and the `postgres` service, so it is
# only valid merged — never run it alone.

services:
    # **Preview: the same image, a second database, a quarter of the memory.**
    #
    # It exists so the `development` branch — and the Expo `preview` channel that points at it —
    # can be exercised against something that is not production. Before this, `preview` builds
    # resolved `EXPO_PUBLIC_API_URL` to the production host and read and wrote live rows.
    #
    # **One Postgres, two databases, not two Postgres.** This is a 2 GB droplet and the
    # production pair already caps at 768m + 640m; a second instance would not fit beside them.
    # A second *database* costs almost nothing and still isolates what matters — a preview
    # migration cannot touch a production row. What it does not isolate is the process: a
    # preview query storm or a Postgres crash takes production down with it. That is the trade,
    # and it holds only while preview traffic is a couple of developers. The answer when it
    # stops holding is a second droplet, not a second container here.
    #
    # `cuzhane_preview` is created by hand once (see deploy/README.md) rather than by an init
    # script: `POSTGRES_DB` only runs on an empty data directory, and this volume is long past
    # that.
    #
    # **Clerk is production's, deliberately.** Preview is for developers, so sharing the user
    # directory means signing in with your own account — and because identity is Clerk's, the
    # preview database keys its own rows off the same user ids. No preview-only secret exists.
    api-preview:
        image: ghcr.io/slmii/cuzhane-api:${PREVIEW_IMAGE_TAG:?set by CI, or pin it in .env}
        restart: unless-stopped
        environment:
            NODE_ENV: production
            PORT: 3001
            CORS_ORIGIN: ${CORS_ORIGIN:-*}
            DATABASE_URL: postgresql://cuzhane:${POSTGRES_PASSWORD}@postgres:5432/cuzhane_preview
            CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
            CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
            APP_STORE_URL: ${APP_STORE_URL:-}
            # The verse meal — see `api` in `compose.yml`.
            QURAN_CLIENT_ID: ${QURAN_CLIENT_ID:-}
            QURAN_CLIENT_SECRET: ${QURAN_CLIENT_SECRET:-}
            # A live reader's voice — see `api` in `compose.yml`.
            CLOUDFLARE_REALTIME_APP_ID: ${CLOUDFLARE_REALTIME_APP_ID:-}
            CLOUDFLARE_REALTIME_APP_TOKEN: ${CLOUDFLARE_REALTIME_APP_TOKEN:-}
            CLOUDFLARE_TURN_KEY_ID: ${CLOUDFLARE_TURN_KEY_ID:-}
            CLOUDFLARE_TURN_KEY_TOKEN: ${CLOUDFLARE_TURN_KEY_TOKEN:-}
        volumes:
            # The Hüsrev pages, read-only — see `api` in `compose.yml`.
            - ./mushaf:/app/apps/server/mushaf:ro
        networks:
            - front
            - back
        healthcheck:
            test:
                [
                    'CMD',
                    'node',
                    '-e',
                    "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
                ]
            interval: 10s
            timeout: 5s
            retries: 6
            start_period: 60s
        read_only: true
        tmpfs:
            - /tmp
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        # Half of production's, and the reason the pair fits on this box at all. Preview serves
        # two people; production must never lose memory to it.
        mem_limit: 384m
        pids_limit: 256
        # Spelled out rather than `*logging`: a YAML anchor does not reach across files.
        logging:
            driver: json-file
            options:
                max-size: '10m'
                max-file: '3'
        depends_on:
            postgres:
                condition: service_healthy
