packages:
  - 'apps/*'

# pnpm 10 blocks dependency postinstall scripts unless they're listed here. Only the
# ones that genuinely need to build are approved: Prisma fetches its query engine, and
# esbuild fetches its platform binary. The rest of what pnpm flags (core-js funding
# notices, optional ws speedups) is deliberately left blocked.
onlyBuiltDependencies:
  - '@prisma/engines'
  - prisma
  - esbuild

# React Navigation ships its packages as a tightly-coupled set. Left to float, the
# navigators resolve ahead of `core` and the app dies at runtime with
# "createScreenFactory is not a function". These are the versions the reference app
# actually runs, so they stay pinned across the whole tree.
overrides:
  react: 19.1.0
  react-dom: 19.1.0
  '@react-navigation/native': 7.2.2
  '@react-navigation/core': 7.17.2
  '@react-navigation/bottom-tabs': 7.15.9
  '@react-navigation/native-stack': 7.14.11
  '@react-navigation/elements': 2.9.14
